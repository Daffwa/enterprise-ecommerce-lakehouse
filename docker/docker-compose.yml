version: '3.8'

services:
  # ============================================================================
  # 1. POSTGRESQL SERVING DATA MART (CONTAINER PORT: 5432, HOST PORT: 5433)
  # ============================================================================
  postgres_warehouse:
    image: postgres:15-alpine
    container_name: ecommerce_postgres_warehouse
    environment:
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: SecretPassword123!
      POSTGRES_DB: ecommerce_mart
    ports:
      - "5433:5432"
    volumes:
      - pg_warehouse_data:/var/lib/postgresql/data
    networks:
      - ecommerce_lakehouse_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_admin -d ecommerce_mart"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. METABASE BUSINESS INTELLIGENCE PLATFORM (HOST PORT: 3001)
  # ============================================================================
  metabase:
    image: metabase/metabase:latest
    container_name: ecommerce_metabase_bi
    ports:
      - "3001:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ecommerce_mart
      MB_DB_PORT: 5432
      MB_DB_USER: postgres_admin
      MB_DB_PASS: SecretPassword123!
      MB_DB_HOST: postgres_warehouse
      JAVA_TIMEZONE: Asia/Jakarta
      MB_EMOJI_IN_LOGS: "true"
    depends_on:
      postgres_warehouse:
        condition: service_healthy
    networks:
      - ecommerce_lakehouse_net
    restart: unless-stopped

networks:
  ecommerce_lakehouse_net:
    name: ecommerce_lakehouse_network

volumes:
  pg_warehouse_data:
